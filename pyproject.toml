[project]
name = "api-cadastro-despesas"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "pydantic-settings==2.14.0",
    "alembic==1.18.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.14.2",
    "ruff==0.15.12",
    "fastapi[standard]"
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
path_separator = "os"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
